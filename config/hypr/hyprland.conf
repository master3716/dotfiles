# ==============================================================================
# Hyprland Configuration (Hyprlang fallback for Hyprland < 0.56, e.g. Ubuntu)
# Note: Hyprland >= 0.56 loads hyprland.lua automatically and ignores this file.
# ==============================================================================

# Monitor (generic fallback; override per-machine if needed)
monitor = , preferred, auto, 1

# Environment
env = PATH,$HOME/.local/bin:$HOME/bin:/usr/local/bin:/usr/bin:/bin
env = NOTHING_ROOT,$HOME/.config
env = XCURSOR_THEME,Adwaita
env = XCURSOR_SIZE,24
env = HYPRCURSOR_THEME,Adwaita
env = HYPRCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,kde
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = GDK_BACKEND,wayland,x11
env = MOZ_ENABLE_WAYLAND,1
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = SDL_VIDEODRIVER,wayland
env = _JAVA_AWT_WM_NONREPARENTING,1
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_DATA_DIRS,$HOME/.local/share/flatpak/exports/share:/var/lib/flatpak/exports/share:/var/lib/snapd/desktop:/usr/local/share:/usr/share
env = GTK_THEME,Adwaita:dark

# Startup (launches Quickshell Nothing UI, or swaybg + waybar fallback)
exec-once = $HOME/.config/scripts/ubuntu-session-start.sh

general {
    gaps_in = 4
    gaps_out = 5
    border_size = 1
    col.active_border = rgba(d71921ff)
    col.inactive_border = rgba(2a2a2aff)
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 4
    active_opacity = 1.0
    inactive_opacity = 0.94

    blur {
        enabled = true
        size = 4
        passes = 2
        noise = 0.035
        contrast = 0.9
        brightness = 0.75
        popups = true
    }
}

animations {
    enabled = true
    bezier = nothing, 0.16, 1.0, 0.30, 1.0
    bezier = nothingSnap, 0.22, 1.0, 0.36, 1.0
    bezier = nothingIn, 0.55, 0.0, 0.30, 1.0
    bezier = linear, 0.0, 0.0, 1.0, 1.0

    animation = global, 1, 3.5, nothing
    animation = windowsIn, 1, 3.5, nothing, popin 85%
    animation = windowsOut, 1, 2.6, nothingIn, popin 88%
    animation = windowsMove, 1, 3.5, nothing
    animation = border, 1, 6.0, linear
    animation = fade, 1, 2.8, nothing
    animation = layersIn, 1, 3.0, nothing, popin 88%
    animation = layersOut, 1, 2.2, nothingIn, fade
    animation = workspaces, 1, 4.0, nothingSnap, slidefade 24%
    animation = specialWorkspace, 1, 4.0, nothingSnap, slidevert
}

dwindle {
    preserve_split = true
    smart_split = false
    smart_resizing = true
}

master {
    new_status = master
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    disable_hyprland_guiutils_check = true
    force_default_wallpaper = 0
    focus_on_activate = true
    background_color = rgba(0b0b0bff)
    vrr = 1
}

input {
    kb_layout = us,il
    kb_options = grp:alt_shift_toggle
    follow_mouse = 1
    sensitivity = 0
    repeat_rate = 25
    repeat_delay = 600

    touchpad {
        natural_scroll = true
        disable_while_typing = true
        scroll_factor = 0.5
    }
}

xwayland {
    force_zero_scaling = true
}

$mainMod = SUPER

# Applications & Launchers
bind = $mainMod, Return, exec, $HOME/.config/scripts/launch-term.sh
bind = $mainMod, T, exec, $HOME/.config/scripts/launch-term.sh
bind = CTRL ALT, T, exec, $HOME/.config/scripts/launch-term.sh
bind = $mainMod, E, exec, sh -c 'command -v nautilus >/dev/null && exec nautilus || command -v dolphin >/dev/null && exec dolphin || command -v thunar >/dev/null && exec thunar'
bind = $mainMod, W, exec, $HOME/.config/scripts/open-default.sh web sh -c 'command -v zen-browser >/dev/null && exec zen-browser || command -v firefox >/dev/null && exec firefox || command -v google-chrome >/dev/null && exec google-chrome'

# Lone Super tap-and-release opens Nothing Launcher (with wofi/rofi fallback)
bindr = $mainMod, SUPER_L, exec, qs -p "$HOME/.config/quickshell/nothing" ipc call launcher toggle 2>/dev/null || (command -v wofi >/dev/null && wofi --show drun) || (command -v rofi >/dev/null && rofi -show drun)
bindr = $mainMod, SUPER_R, exec, qs -p "$HOME/.config/quickshell/nothing" ipc call launcher toggle 2>/dev/null || (command -v wofi >/dev/null && wofi --show drun) || (command -v rofi >/dev/null && rofi -show drun)

bind = $mainMod, Space, exec, sh -c 'qs -p "$HOME/.config/quickshell/nothing" ipc call launcher toggle 2>/dev/null || (command -v wofi >/dev/null && wofi --show drun) || (command -v rofi >/dev/null && rofi -show drun)'
bind = $mainMod, R, exec, sh -c 'qs -p "$HOME/.config/quickshell/nothing" ipc call launcher toggle 2>/dev/null || (command -v wofi >/dev/null && wofi --show drun) || (command -v rofi >/dev/null && rofi -show drun)'
bind = $mainMod, Tab, exec, sh -c 'qs -p "$HOME/.config/quickshell/nothing" ipc call launcher toggle 2>/dev/null || (command -v wofi >/dev/null && wofi --show drun)'
bind = $mainMod, V, exec, qs -p "$HOME/.config/quickshell/nothing" ipc call clipboard toggle
bind = $mainMod, N, exec, qs -p "$HOME/.config/quickshell/nothing" ipc call bar toggle
bind = $mainMod, B, exec, qs -p "$HOME/.config/quickshell/nothing" ipc call notifications toggle
bind = $mainMod, I, exec, qs -p "$HOME/.config/quickshell/nothing" ipc call settings toggle
bind = $mainMod, A, exec, qs -p "$HOME/.config/quickshell/nothing" ipc call essential toggle
bind = $mainMod ALT, A, exec, qs -p "$HOME/.config/quickshell/nothing" ipc call apps toggle
bind = $mainMod, G, exec, qs -p "$HOME/.config/quickshell/nothing" ipc call game toggle
bind = $mainMod SHIFT, T, exec, qs -p "$HOME/.config/quickshell/nothing" ipc call wallpaperpicker toggle
bind = $mainMod ALT, W, exec, qs -p "$HOME/.config/quickshell/nothing" ipc call wallpaper next
bind = $mainMod SHIFT, G, exec, qs -p "$HOME/.config/quickshell/nothing" ipc call glyph next
bind = $mainMod ALT, L, exec, qs -p "$HOME/.config/quickshell/nothing" ipc call nothing toggle
bind = $mainMod ALT, I, exec, qs -p "$HOME/.config/quickshell/nothing" ipc call caffeine toggle
bind = $mainMod ALT, B, exec, qs -p "$HOME/.config/quickshell/nothing" ipc call nightlight toggle
bind = CTRL SHIFT, Escape, exec, qs -p "$HOME/.config/quickshell/nothing" ipc call settings processes
bind = $mainMod, P, exec, qs -p "$HOME/.config/quickshell/nothing" ipc call displays toggle
bind = $mainMod, L, exec, $HOME/.config/scripts/lock.sh
bind = $mainMod, Escape, exec, qs -p "$HOME/.config/quickshell/nothing" ipc call session toggle
bind = CTRL ALT, Delete, exec, qs -p "$HOME/.config/quickshell/nothing" ipc call session toggle
bind = $mainMod SHIFT, X, exec, qs -p "$HOME/.config/quickshell/nothing" ipc call screenshot ocr
bind = $mainMod SHIFT, C, exec, hyprpicker -a

# Windows & Layout
bind = $mainMod, Q, killactive
bind = $mainMod, X, killactive
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, D, fullscreen, 1
bind = $mainMod SHIFT, F, fullscreen, 1
bind = $mainMod ALT, Space, togglefloating
bind = $mainMod, J, togglesplit
bind = $mainMod SHIFT, Space, exec, hyprctl switchxkblayout current next

# Resize (Alt + Arrows, Super + Alt + Arrows, Super + Comma/Semicolon)
binde = ALT, Left, splitratio, -0.05
binde = ALT, Right, splitratio, +0.05
binde = ALT, Up, splitratio, -0.05
binde = ALT, Down, splitratio, +0.05
binde = $mainMod ALT, Left, splitratio, -0.05
binde = $mainMod ALT, Right, splitratio, +0.05
binde = $mainMod ALT, Up, splitratio, -0.05
binde = $mainMod ALT, Down, splitratio, +0.05
binde = $mainMod, comma, splitratio, -0.1
binde = $mainMod, semicolon, splitratio, +0.1

# Focus & Move Windows
bind = $mainMod, Left, movefocus, l
bind = $mainMod, Right, movefocus, r
bind = $mainMod, Up, movefocus, u
bind = $mainMod, Down, movefocus, d

bind = $mainMod SHIFT, Left, movewindow, l
bind = $mainMod SHIFT, Right, movewindow, r
bind = $mainMod SHIFT, Up, movewindow, u
bind = $mainMod SHIFT, Down, movewindow, d

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod ALT, 1, movetoworkspacesilent, 1
bind = $mainMod ALT, 2, movetoworkspacesilent, 2
bind = $mainMod ALT, 3, movetoworkspacesilent, 3
bind = $mainMod ALT, 4, movetoworkspacesilent, 4
bind = $mainMod ALT, 5, movetoworkspacesilent, 5
bind = $mainMod ALT, 6, movetoworkspacesilent, 6
bind = $mainMod ALT, 7, movetoworkspacesilent, 7
bind = $mainMod ALT, 8, movetoworkspacesilent, 8
bind = $mainMod ALT, 9, movetoworkspacesilent, 9
bind = $mainMod ALT, 0, movetoworkspacesilent, 10

bind = CTRL $mainMod, Left, workspace, r-1
bind = CTRL $mainMod, Right, workspace, r+1
bind = $mainMod, S, togglespecialworkspace, special
bind = $mainMod ALT, S, movetoworkspacesilent, special:special

# Mouse drag/resize
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Discord / Vesktop global deafen
bindl = , F12, sendshortcut, CTRL SHIFT, d, class:.*([Dd]iscord|[Vv]esktop).*

# Screenshots & Media
bind = $mainMod SHIFT, S, exec, qs -p "$HOME/.config/quickshell/nothing" ipc call screenshot region
bind = CTRL SHIFT, S, exec, qs -p "$HOME/.config/quickshell/nothing" ipc call screenshot region
bind = , Print, exec, qs -p "$HOME/.config/quickshell/nothing" ipc call screenshot screen
bindl = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 2%+
bindl = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

# Window Rules (Hyprland 0.53+ syntax)
windowrule = suppress_event maximize, match:class .*
windowrule = float on, match:class ^(pavucontrol|nm-connection-editor|blueman-manager)$
windowrule = float on, match:title ^(Picture-in-Picture)$
windowrule = pin on, match:title ^(Picture-in-Picture)$
